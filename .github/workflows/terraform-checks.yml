# Runs path-aware checks for pull requests targeting main. Application changes
# run tests and a container build; Terraform changes validate only affected
# roots, with shared changes also validating production because it consumes
# shared outputs. Same-repository pull requests can create read-only Terraform
# plans using the plan role; fork pull requests never receive AWS credentials.
# This workflow does not apply infrastructure.
name: Terraform checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: terraform-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  SHARED_STATE_KEY: hello-saas/shared/terraform.tfstate
  PRODUCTION_STATE_KEY: hello-saas/production/terraform.tfstate

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      production: ${{ steps.filter.outputs.production }}
      app: ${{ steps.filter.outputs.app }}
      state_bootstrap: ${{ steps.filter.outputs.state_bootstrap }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'terraform/shared/**'
              - '!terraform/shared/state-bootstrap/**'
            production:
              - 'terraform/production/**'
              - 'terraform/modules/**'
              - 'terraform/shared/**'
              - '!terraform/shared/state-bootstrap/**'
            app:
              - 'python_service/**'
              - 'tests/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'requirements.txt'
              - 'requirements-dev.txt'
            state_bootstrap:
              - 'terraform/shared/state-bootstrap/**'

  app-tests:
    name: Test application changes
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run application tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build the application container
        run: docker build --platform linux/amd64 --tag hello-saas:ci .

  terraform-format:
    name: Check Terraform formatting
    needs: changes
    if: >-
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.production == 'true' ||
      needs.changes.outputs.state_bootstrap == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Check formatting
        run: terraform fmt -check -recursive

  shared-validation:
    name: Validate shared Terraform
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Initialize and validate shared root
        run: |
          terraform -chdir=terraform/shared init -backend=false -input=false
          terraform -chdir=terraform/shared validate

  production-validation:
    name: Validate production Terraform
    needs: changes
    if: needs.changes.outputs.production == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Initialize and validate production root
        run: |
          terraform -chdir=terraform/production init -backend=false -input=false
          terraform -chdir=terraform/production validate

  state-bootstrap-validation:
    name: Validate state bootstrap Terraform
    needs: changes
    if: needs.changes.outputs.state_bootstrap == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Initialize and validate state bootstrap root
        run: |
          terraform -chdir=terraform/shared/state-bootstrap init -backend=false -input=false
          terraform -chdir=terraform/shared/state-bootstrap validate

  checks:
    name: Test and validate configuration
    if: always()
    needs:
      - changes
      - app-tests
      - terraform-format
      - shared-validation
      - production-validation
      - state-bootstrap-validation
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_RESULT: ${{ needs.app-tests.result }}
          FORMAT_RESULT: ${{ needs.terraform-format.result }}
          SHARED_RESULT: ${{ needs.shared-validation.result }}
          PRODUCTION_RESULT: ${{ needs.production-validation.result }}
          BOOTSTRAP_RESULT: ${{ needs.state-bootstrap-validation.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$APP_RESULT" \
            "$FORMAT_RESULT" \
            "$SHARED_RESULT" \
            "$PRODUCTION_RESULT" \
            "$BOOTSTRAP_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::An applicable check did not succeed (result: $result)."
              exit 1
            fi
          done

  plan:
    name: Plan and comment on PR
    needs: [changes, checks]
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN != '' &&
      (needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.production == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || '' }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID || '' }}
      TF_VAR_create_route53_zone: ${{ vars.CREATE_ROUTE53_ZONE || 'false' }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.GITHUB_OIDC_PROVIDER_ARN || '' }}
      TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_shared_state_key: hello-saas/shared/terraform.tfstate
      TF_VAR_production_state_key: hello-saas/production/terraform.tfstate
      TF_VAR_enable_database: ${{ vars.ENABLE_DATABASE || 'false' }}
      TF_VAR_database_multi_az: ${{ vars.DATABASE_MULTI_AZ || 'false' }}
      TF_VAR_database_deletion_protection: ${{ vars.DATABASE_DELETION_PROTECTION || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Plan shared root
        id: shared
        if: needs.changes.outputs.shared == 'true'
        run: |
          set -euo pipefail
          terraform -chdir=terraform/shared init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${SHARED_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/shared plan -input=false -lock=false -out=shared.tfplan
          terraform -chdir=terraform/shared show -no-color shared.tfplan > "${RUNNER_TEMP}/shared-plan.txt"

      - name: Plan production root
        id: production
        if: needs.changes.outputs.production == 'true'
        run: |
          set -euo pipefail
          terraform -chdir=terraform/production init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${PRODUCTION_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=terraform/production plan \
            -input=false \
            -lock=false \
            -var="image_tag=pr-plan" \
            -out=production.tfplan
          terraform -chdir=terraform/production show -no-color production.tfplan > "${RUNNER_TEMP}/production-plan.txt"

      - name: Post or update the plan comment
        if: always()
        uses: actions/github-script@v7
        env:
          SHARED_OUTCOME: ${{ steps.shared.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-comment -->';
            const limit = 26000;
            const readPlan = (name) => {
              try {
                const text = fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}`, 'utf8');
                return text.length > limit
                  ? `${text.slice(0, limit)}\n... truncated; see workflow logs for remaining output ...`
                  : text;
              } catch {
                return 'No plan output was produced; see the workflow logs for the failure.';
              }
            };
            const status = (value) => value === 'success' ? '✅' : value === 'skipped' ? '⏭️' : '❌';
            const body = [
              marker,
              '## Terraform plan',
              `${status(process.env.SHARED_OUTCOME)} Shared   ${status(process.env.PRODUCTION_OUTCOME)} Production`,
              '',
              '<details><summary>Shared plan</summary>',
              '',
              '```hcl',
              readPlan('shared-plan.txt'),
              '```',
              '</details>',
              '',
              '<details><summary>Production plan</summary>',
              '',
              '```hcl',
              readPlan('production-plan.txt'),
              '```',
              '</details>',
              '',
              `Commit ${context.sha.slice(0, 7)}. This is a read-only plan; nothing is applied from a pull request.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
